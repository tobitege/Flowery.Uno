# Generate the existing lightweight documentation. Publishing belongs to pages.yml.
name: Generate Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate markdown documentation
        run: python Utils/generate_docs.py

      - name: Generate HTML site
        run: python Utils/generate_site.py

      - name: Verify output
        run: test -f docs/index.html

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: pages-docs
          path: docs/
          if-no-files-found: error
          retention-days: 30
