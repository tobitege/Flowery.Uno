name: Release

# MANUAL TRIGGER ONLY - Creates a new release with NuGet package and Gallery app
# Go to Actions → Release → Run workflow → Enter version (e.g., 0.1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0) - without "v" prefix'
        required: true
        type: string
      skip_nuget:
        description: 'Skip NuGet publish (useful for re-running failed releases)'
        required: false
        type: boolean
        default: false
      skip_tag:
        description: 'Skip tag creation (assumes you already pushed the tag manually)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use semantic versioning (e.g., 0.1.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION, Tag: v$VERSION"

  build-library:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Uno Workloads
        run: dotnet workload install uno-check || true

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Install Android workload
        run: dotnet workload install android

      - name: Verify version from evaluated MSBuild properties
        run: |
          EVALUATED_VERSION=$(dotnet msbuild Flowery.Uno/Flowery.Uno.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '[:space:]')
          if [ "$EVALUATED_VERSION" != "${{ needs.validate.outputs.version }}" ]; then
            echo "::error::Version mismatch! evaluated project version is $EVALUATED_VERSION but you specified ${{ needs.validate.outputs.version }}"
            echo "::error::Please update the centralized version metadata (Directory.Build.*) or project metadata."
            exit 1
          fi
          echo "✅ Version matches: $EVALUATED_VERSION"

      - name: Build library
        run: dotnet build Flowery.Uno/Flowery.Uno.csproj -c Release -o ./build-output -p:CheckEolWorkloads=false

      - name: Create NuGet package
        run: dotnet pack Flowery.Uno/Flowery.Uno.csproj -c Release -o ./artifacts -p:CheckEolWorkloads=false

      - name: Create library zip
        run: |
          mkdir -p ./artifacts/lib
          cp ./build-output/Flowery.Uno.dll ./artifacts/lib/ || true
          cp ./build-output/Flowery.Uno.pdb ./artifacts/lib/ || true
          cd ./artifacts/lib
          zip ../Flowery.Uno-lib.zip * || echo "No library files to zip"

      - name: Upload library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: library-artifacts
          path: |
            ./artifacts/*.nupkg
            ./artifacts/Flowery.Uno-lib.zip
          if-no-files-found: ignore

  build-gallery:
    needs: [validate, build-library]
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Uno Workloads
        run: dotnet workload install uno-check || true

      - name: Publish Gallery App (Windows)
        shell: pwsh
        run: |
          ./scripts/publish_windows.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -SelfContained:$true `
            -OutputDir publish

      - name: Zip Windows artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath ./Flowery.Gallery-Windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.Gallery-Windows-x64
          path: ./Flowery.Gallery-Windows-x64.zip

  # Gallery packages built by scripts/gallery (see scripts/gallery/README.md).
  # Windows (Skia) zips and Linux .deb files are cross-published from one Linux runner.
  build-gallery-desktop:
    needs: [validate, build-library]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify version from evaluated MSBuild properties
        run: |
          EVALUATED_VERSION=$(dotnet msbuild Flowery.Uno/Flowery.Uno.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '[:space:]')
          if [ "$EVALUATED_VERSION" != "${{ needs.validate.outputs.version }}" ]; then
            echo "::error::Version mismatch! evaluated project version is $EVALUATED_VERSION but you specified ${{ needs.validate.outputs.version }}"
            exit 1
          fi

      - name: Install librsvg (icon rendering)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build Windows zips (x64 + arm64)
        run: bash scripts/gallery/build-windows.sh

      - name: Build Linux .deb packages (amd64 + arm64)
        run: bash scripts/gallery/build-deb-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.Gallery-Desktop
          path: scripts/gallery/output/installer/*

  build-gallery-android:
    needs: [validate, build-library]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Verify version from evaluated MSBuild properties
        run: |
          EVALUATED_VERSION=$(dotnet msbuild Flowery.Uno/Flowery.Uno.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '[:space:]')
          if [ "$EVALUATED_VERSION" != "${{ needs.validate.outputs.version }}" ]; then
            echo "::error::Version mismatch! evaluated project version is $EVALUATED_VERSION but you specified ${{ needs.validate.outputs.version }}"
            exit 1
          fi

      # Optional: sign with your own keystore. Without these secrets the APK uses the debug key.
      - name: Prepare Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "FLOWERY_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "FLOWERY_ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "FLOWERY_ANDROID_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: the APK will be signed with the debug key."
          fi

      - name: Build APK
        run: bash scripts/gallery/build-android.sh -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=true -p:CheckEolWorkloads=false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.Gallery-Android
          path: scripts/gallery/output/installer/*.apk

  build-gallery-macos:
    needs: [validate, build-library]
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify version from evaluated MSBuild properties
        run: |
          EVALUATED_VERSION=$(dotnet msbuild Flowery.Uno/Flowery.Uno.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '[:space:]')
          if [ "$EVALUATED_VERSION" != "${{ needs.validate.outputs.version }}" ]; then
            echo "::error::Version mismatch! evaluated project version is $EVALUATED_VERSION but you specified ${{ needs.validate.outputs.version }}"
            exit 1
          fi

      - name: Install tools
        run: brew install create-dmg librsvg

      # Optional: Developer ID signing. Without these secrets the app gets an ad-hoc signature
      # (the DMG opens with right-click > Open).
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CERT_NAME: ${{ secrets.MACOS_DEV_ID_CERT }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            echo "FLOWERY_DEV_ID_CERT=$CERT_NAME" >> "$GITHUB_ENV"
          else
            echo "No certificate secret: ad-hoc signing."
            echo "FLOWERY_DEV_ID_CERT=__no_certificate__" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: bash scripts/gallery/build-dmg-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.Gallery-macOS
          path: scripts/gallery/output/installer/*.dmg

  publish:
    needs: [validate, build-library, build-gallery, build-gallery-desktop, build-gallery-android, build-gallery-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts

      - name: Collect artifacts
        run: |
          mkdir -p ./final
          find ./release-artifacts -name "*.nupkg" -exec cp {} ./final/ \; || true
          find ./release-artifacts -name "*.zip" -exec cp {} ./final/ \;
          find ./release-artifacts \( -name "*.deb" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} ./final/ \;
          echo "=== Release artifacts ==="
          ls -la ./final/

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
            }
            found && !/^## \[/ { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            echo "⚠️ No changelog entry found for version $VERSION"
            CHANGELOG="No changelog entry for this version."
          fi

          echo "$CHANGELOG" > changelog_section.md
          echo "✅ Extracted changelog for v$VERSION"

      - name: NuGet login
        if: ${{ inputs.skip_nuget != true }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: tobitege

      - name: Publish to NuGet
        if: ${{ inputs.skip_nuget != true }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet login did not return an API key."
            exit 1
          fi

          shopt -s nullglob
          packages=(./final/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in ./final. Check the pack/upload/download steps."
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

          echo "✅ Published to NuGet.org"

      - name: Create and push tag
        if: ${{ inputs.skip_tag != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.validate.outputs.tag }}
          git push origin ${{ needs.validate.outputs.tag }}
          echo "✅ Created tag: ${{ needs.validate.outputs.tag }}"

      - name: Skip tag creation
        if: ${{ inputs.skip_tag == true }}
        run: echo "⏭️ Skipping tag creation (tag already exists)"

      - name: Build release notes
        run: |
          cat > release_notes.md << 'HEADER'
          ## 📋 What's Changed
          HEADER
          cat changelog_section.md >> release_notes.md
          cat >> release_notes.md << 'FOOTER'

          ---

          ## 📦 Library

          | Asset | Description |
          |-------|-------------|
          FOOTER

          echo "| \`Flowery.Uno.${{ needs.validate.outputs.version }}.nupkg\` | NuGet package (also on [nuget.org](https://www.nuget.org/packages/Flowery.Uno)) |" >> release_notes.md
          echo "| \`Flowery.Uno-lib.zip\` | Compiled DLL and PDB |" >> release_notes.md

          cat >> release_notes.md << 'GALLERY'

          ## 🌸 Gallery Demo App

          Self-contained executable for demoing Flowery.Uno controls (no .NET install required).

          | Platform | Download |
          |----------|----------|
          | Windows x64 (WinUI) | `Flowery.Gallery-Windows-x64.zip` |
          | Windows x64 (Skia, portable) | `FloweryUnoGallery_win-x64.zip` |
          | Windows arm64 (Skia, portable) | `FloweryUnoGallery_win-arm64.zip` |
          | Linux x64 (.deb) | `flowery-uno-gallery_<version>_amd64.deb` |
          | Linux arm64 (.deb) | `flowery-uno-gallery_<version>_arm64.deb` |
          | macOS (arm64 + x64) | `FloweryUnoGallery.dmg` |
          | Android (arm64 + x64) | `FloweryUnoGallery.apk` |
          GALLERY

          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Load custom release notes
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            cat release_notes.md
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "v${{ needs.validate.outputs.version }}"
          files: ./final/*
          generate_release_notes: true
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NuGet:** https://www.nuget.org/packages/Flowery.Uno/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
