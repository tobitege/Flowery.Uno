<body class="content-body">
    <div class="breadcrumbs"><a href="../home.html">Home</a></div><h1>DaisyTooltip</h1>

<p>A tooltip control styled after DaisyUI's Tooltip component. Wraps content and shows a tooltip on hover.</p>

<strong>Inherits from:</strong> <code>DaisyBaseContentControl</code>

    <div class="nav-left"><a href="DaisyToggle.html">← Toggle</a></div>

    <script>
// Syntax highlighting
hljs.highlightAll();

// Theme Sync Logic for Iframe Content
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
}

// 1. Initial Load: Try to get theme from localStorage
const savedTheme = localStorage.getItem('theme') || 'dark';
applyTheme(savedTheme);

// 2. Listen for messages from parent (shell)
window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'setTheme') {
        applyTheme(event.data.theme);
    }
});

// 3. Notify parent when this page loads (for sidebar sync)
if (window.parent !== window) {
    window.parent.postMessage({
        type: 'pageLoaded',
        path: window.location.pathname,
        href: window.location.href
    }, '*');
}


    </script>
</body>
</html>
